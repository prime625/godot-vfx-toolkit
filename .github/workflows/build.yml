name: Build GDExtension

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64, arm32]
        include:
          - arch: arm64
            scons_arch: arm64
          - arch: arm32
            scons_arch: arm32

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SCons
        run: pip install scons==4.8.0

      - name: Setup NDK r23c (Godot-tested version)
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r23c-linux.zip
          unzip -q android-ndk-r23c-linux.zip
          sudo mkdir -p /usr/local/lib/android/sdk/ndk
          sudo mv android-ndk-r23c /usr/local/lib/android/sdk/ndk/23.2.8568313
          echo "ANDROID_NDK_ROOT=/usr/local/lib/android/sdk/ndk/23.2.8568313" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/23.2.8568313" >> $GITHUB_ENV

      - name: Clean cached artifacts
        run: |
          echo "=== Cleaning extension objects ==="
          scons -c platform=android arch=${{ matrix.scons_arch }} target=template_debug 2>/dev/null || true
          scons -c platform=android arch=${{ matrix.scons_arch }} target=template_release 2>/dev/null || true

          echo "=== Cleaning godot-cpp objects ==="
          cd godot-cpp
          scons -c platform=android arch=${{ matrix.scons_arch }} target=template_debug 2>/dev/null || true
          scons -c platform=android arch=${{ matrix.scons_arch }} target=template_release 2>/dev/null || true
          cd ..

          echo "=== Nuking all .os files and generated bindings ==="
          rm -f src/*.os
          find . -name "*.os" -delete 2>/dev/null || true
          find . -name "*.o" -delete 2>/dev/null || true
          rm -rf godot-cpp/gen 2>/dev/null || true
          rm -rf godot-cpp/src/gen 2>/dev/null || true

      - name: Generate godot-cpp bindings
        env:
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/23.2.8568313
        run: |
          cd godot-cpp
          scons platform=android arch=${{ matrix.scons_arch }} target=template_debug generate_bindings=yes -j$(nproc)

      - name: Build Extension
        env:
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/23.2.8568313
        run: |
          scons platform=android arch=${{ matrix.scons_arch }} target=template_debug -j$(nproc)
          scons platform=android arch=${{ matrix.scons_arch }} target=template_release -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.arch }}
          path: |
            demo/addons/vfx_toolkit/**/*.so
            demo/addons/vfx_toolkit/**/*.gdextension

  build-ios:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - arch: arm64
            target: template_debug
          - arch: arm64
            target: template_release
          - arch: x86_64
            target: template_debug
          - arch: x86_64
            target: template_release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SCons
        run: pip install scons==4.8.0

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Clean cached artifacts
        run: |
          echo "=== Cleaning extension objects ==="
          scons -c platform=ios arch=${{ matrix.arch }} target=${{ matrix.target }} 2>/dev/null || true

          echo "=== Cleaning godot-cpp objects ==="
          cd godot-cpp
          scons -c platform=ios arch=${{ matrix.arch }} target=${{ matrix.target }} 2>/dev/null || true
          cd ..

          echo "=== Nuking build artifacts ==="
          rm -f src/*.os src/*.o
          find . -name "*.os" -delete 2>/dev/null || true
          find . -name "*.o" -delete 2>/dev/null || true
          rm -rf godot-cpp/gen 2>/dev/null || true
          rm -rf godot-cpp/src/gen 2>/dev/null || true

      - name: Generate godot-cpp bindings
        run: |
          cd godot-cpp
          scons platform=ios arch=arm64 target=template_debug generate_bindings=yes -j$(sysctl -n hw.ncpu)

      - name: Build Extension
        run: |
          scons platform=ios arch=${{ matrix.arch }} target=${{ matrix.target }} -j$(sysctl -n hw.ncpu)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.arch }}-${{ matrix.target }}
          path: |
            demo/addons/vfx_toolkit/**/*.dylib
            demo/addons/vfx_toolkit/**/*.gdextension

  package:
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for .gdextension manifest)
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package Addon
        run: |
          mkdir -p release/addons/vfx_toolkit
          cp -r artifacts/*/* release/addons/vfx_toolkit/ || true
          cp demo/addons/vfx_toolkit/*.gdextension release/addons/vfx_toolkit/ 2>/dev/null || true
          cd release && zip -r ../godot_vfx_toolkit_all.zip addons/

      - name: Upload Release Package
        uses: actions/upload-artifact@v4
        with:
          name: godot_vfx_toolkit_all
          path: godot_vfx_toolkit_all.zip
