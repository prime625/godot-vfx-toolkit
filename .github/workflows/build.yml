name: Build Android GDExtension

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64, arm32]
        include:
          - arch: arm64
            scons_arch: arm64
          - arch: arm32
            scons_arch: arm32

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SCons
        run: pip install scons==4.8.0

      - name: Download NDK r26d
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip

      - name: Generate godot-cpp bindings
        run: |
          export ANDROID_NDK_ROOT=$PWD/android-ndk-r26d
          export ANDROID_NDK_HOME=$PWD/android-ndk-r26d
          echo "Using NDK: $ANDROID_NDK_ROOT"
          cd godot-cpp
          scons platform=android arch=${{ matrix.scons_arch }} target=template_debug generate_bindings=yes -j$(nproc)

      - name: Build Extension
        run: |
          export ANDROID_NDK_ROOT=$PWD/android-ndk-r26d
          export ANDROID_NDK_HOME=$PWD/android-ndk-r26d
          scons platform=android arch=${{ matrix.scons_arch }} target=template_debug -j$(nproc)
          scons platform=android arch=${{ matrix.scons_arch }} target=template_release -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.arch }}
          path: |
            demo/addons/vfx_toolkit/**/*.so
            demo/addons/vfx_toolkit/**/*.gdextension

  package:
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: android-*

      - name: Package Addon
        run: |
          mkdir -p release/addons/vfx_toolkit
          cp -r artifacts/*/* release/addons/vfx_toolkit/ || true
          cp demo/addons/vfx_toolkit/*.gdextension release/addons/vfx_toolkit/ 2>/dev/null || true
          cd release && zip -r ../godot_vfx_toolkit_android.zip addons/

      - name: Upload Release Package
        uses: actions/upload-artifact@v4
        with:
          name: godot_vfx_toolkit_android
          path: godot_vfx_toolkit_android.zip
